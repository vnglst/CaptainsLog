name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: macos-26
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag and source branch
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TAG_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          if [[ "$TAG" != "v$VERSION" || ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag in vMAJOR.MINOR.PATCH form; got $TAG" >&2
            exit 1
          fi

          SOURCE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$SOURCE_VERSION" != "$VERSION" ]]; then
            echo "Tag version $VERSION does not match VERSION file ($SOURCE_VERSION)." >&2
            exit 1
          fi

          DEFAULT_BRANCH="$(gh api "repos/$REPOSITORY" --jq .default_branch)"
          git fetch origin "$DEFAULT_BRANCH"
          DEFAULT_SHA="$(git rev-parse FETCH_HEAD)"
          BRANCH_VERSION="$(git show "$DEFAULT_SHA:VERSION" | tr -d '[:space:]')"
          if [[ "$BRANCH_VERSION" != "$VERSION" ]]; then
            echo "Tag version $VERSION does not match VERSION on $DEFAULT_BRANCH ($BRANCH_VERSION)." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_SHA" "$DEFAULT_SHA"; then
            echo "Release tag commit must be present on $DEFAULT_BRANCH." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "default_branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Validate and prepare changelog release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: make --silent release-notes VERSION="$VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Build app, CLI, and release archive
        run: make packaging

      - name: Verify archive and calculate checksum
        id: archive
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          ARCHIVE="dist/CaptainsLog-$VERSION.zip"
          test -f "$ARCHIVE"
          shasum -a 256 "$ARCHIVE"
          echo "path=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.release.outputs.version }}
          ARCHIVE: ${{ steps.archive.outputs.path }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" "$ARCHIVE" \
              --title "CaptainsLog $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          fi

      - name: Update Homebrew cask
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.archive.outputs.sha256 }}
          DEFAULT_BRANCH: ${{ steps.release.outputs.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          git switch --force-create "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"

          make release-cask VERSION="$VERSION" SHA256="$SHA256"

          git diff --check
          if git diff --quiet -- Casks/captainslog.rb; then
            echo "Cask already matches this release."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/captainslog.rb
          git commit -m "chore(release): update Homebrew cask to $VERSION"
          git push origin "$DEFAULT_BRANCH"

      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: vnglst/homebrew-captainslog
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || github.token }}
          path: homebrew-captainslog

      - name: Publish cask to Homebrew tap
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DEFAULT_BRANCH: ${{ steps.release.outputs.default_branch }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "Add the HOMEBREW_TAP_TOKEN Actions secret before creating releases." >&2
            exit 1
          fi
          mkdir -p homebrew-captainslog/Casks
          cp Casks/captainslog.rb homebrew-captainslog/Casks/captainslog.rb
          git -C homebrew-captainslog diff --check
          if git -C homebrew-captainslog diff --quiet -- Casks/captainslog.rb; then
            echo "Homebrew tap already matches this release."
            exit 0
          fi

          git -C homebrew-captainslog config user.name "github-actions[bot]"
          git -C homebrew-captainslog config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-captainslog add Casks/captainslog.rb
          git -C homebrew-captainslog commit -m "chore(release): update CaptainsLog cask to $VERSION"
          git -C homebrew-captainslog push origin "HEAD:$DEFAULT_BRANCH"
