name: Runtime fix verification
on:
  push:
    branches:
      - codex/fix-runtime-lipo
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Report toolchain
        run: xcodebuild -version
      - name: Test release tooling
        run: make tests-release
      - name: Verify pinned runtime integration
        run: make tests-runtime
      - name: Run deterministic tests
        run: make tests
      - name: Build and verify release packaging
        run: make packaging
