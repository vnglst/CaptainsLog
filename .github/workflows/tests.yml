name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog and release tooling
    runs-on: macos-26
    steps:
      - name: Check out source and Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test release tooling
        run: bash scripts/test-release-tooling.sh

      - name: Require changelog coverage
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: swift scripts/release.swift check "$BASE" "$HEAD"

  unit-tests:
    name: Lightweight deterministic tests
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install native build dependency
        run: brew install llama.cpp

      - name: Run unit tests
        run: swift run run-tests --unit
